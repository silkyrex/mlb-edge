        - generic [ref=e757]:
          - paragraph [ref=e758]: The 30-year JGB hit 4% on May 15. Most people read that as a bond market headline and move on.
          - paragraph [ref=e783]: That’s the wrong read.
          - generic [ref=e1234]:
            - paragraph [ref=e1236]: Thanks for reading Paper's Substack! Subscribe for free to receive new posts and support my work.
            - generic [ref=e1237]:
              - textbox [ref=e1342]:
                - /placeholder: Type your email…
              - button [ref=e1343] [cursor=pointer]: Subscribe
          - paragraph [ref=e1241]: This is a US equity story. And the market hasn’t priced it yet.
          - heading [level=2] [ref=e1344]: Thirty Years of Forced Exile
          - paragraph [ref=e1243]: For three decades, Japan’s central bank held rates near zero. Sometimes negative. Japanese life insurers, pension funds, and banks couldn’t earn anything at home. So they went abroad. They bought US Treasuries. They bought European sovereigns. They funded the carry trade that quietly underwrote global risk appetite for a generation. Japan’s institutions now hold roughly $1.14 trillion in US Treasuries alone.
          - paragraph [ref=e1244]: That flow is reversing.
          - heading [level=2] [ref=e1345]: The Threshold That Actually Matters
          - paragraph [ref=e1246]: The 30Y JGB at 4% is not just a psychological number. There’s a specific reason it matters for US assets.
          - paragraph [ref=e1247]: When a Japanese institution buys a US Treasury, it doesn’t keep the 4.5% yield in dollar terms. It has to hedge the currency risk -- convert future dollar cash flows back to yen. That hedge costs approximately 4 to 4.5% per year on a one-year basis.
          - paragraph [ref=e1248]: "Run the math. US 10-year at 4.59%, minus 4 to 4.5% hedging cost: roughly 0 to 0.5% in yen terms, net of currency risk."
          - paragraph [ref=e1249]: "A 30-year JGB at 4%, held domestically in yen, zero hedging cost: 4%."
          - paragraph [ref=e1250]: At that spread, repatriation stops being a theoretical risk. It becomes an arithmetic inevitability.
          - heading [level=2] [ref=e1346]: The Structure Has Already Changed
          - paragraph [ref=e1252]: The Bank of Japan abandoned Yield Curve Control in late 2025. YCC was the mechanism that artificially capped Japanese long-end rates for a decade -- it suppressed domestic yields and forced capital offshore. Without it, the JGB curve is in open price discovery for the first time since 2016.
          - paragraph [ref=e1253]: The BoJ held at 0.75% in April, but the vote was 6-3. Three dissenters pushed for 1.00% immediately. The BoJ simultaneously raised its FY2026 CPI forecast from 1.9% to 2.8% and cut GDP to 0.5%. Markets are pricing 1.00 to 1.25% by year-end. A June or July hike is live.
          - paragraph [ref=e1254]: Every 25 basis points on the BoJ policy rate narrows the yield differential that made borrowing yen and buying dollar assets attractive in the first place. The carry trade runs on that differential. It’s getting smaller.
          - heading [level=2] [ref=e1347]: What the Institutions Are Actually Doing
          - paragraph [ref=e1256]: The real driver here is regulatory, not sentiment.
          - paragraph [ref=e1257]: Japan’s new J-ICS economic value solvency regime, effective April 2025, forces mark-to-market on both assets and liabilities. Under the old regime, life insurers were incentivized to hold long-duration foreign bonds without fully accounting for the currency and duration mismatch on their balance sheets. The new regime closes that loophole. The structural bid for foreign bonds that existed for thirty years is gone.
          - paragraph [ref=e1258]: What you’re seeing in the data is that signal playing out in slow motion. Nippon Life -- Japan’s largest life insurer -- announced in April it is reducing domestic yen bond holdings and rotating toward private credit. Japan Post Insurance signaled a similar shift in March. Japan’s midsize life insurers have stopped buying JGB superlong bonds even at current yield levels, sitting on the sidelines waiting for yields to go higher before committing domestically. None of this is direct US Treasury selling -- yet. It is institutions repositioning away from the regime that made offshore dollar assets necessary. The US Treasury position is the lagging indicator. The regulatory incentive that built it is already gone.
          - paragraph [ref=e1259]: This isn’t panic. It’s math.
          - paragraph [ref=e1260]: "The current estimated repatriation rate across all Japanese institutions is $2 to $4 billion per month. Over two to three years: $55 to $135 billion flowing out of Japan’s $1.14 trillion US Treasury position. Not an acute dump. A slow bleed."
          - paragraph [ref=e1261]: Slow bleeds are dangerous in ways dumps aren’t. A dump gets absorbed in a crisis event with a clean bottom. A slow bleed reprices the long-term equilibrium and gives the market no moment to capitulate against.
          - heading [level=2] [ref=e1348]: Three Channels, Happening Simultaneously
          - paragraph [ref=e1263]:
            - strong [ref=e1264]: US Treasury selloff.
            - text: As Japanese institutions repatriate capital, they sell Treasuries, supply rises, the marginal buyer steps back. On May 15 alone, the US 10-year moved 14 basis points to 4.59%. The US 30-year moved 11 basis points to 5.12%. Japan is one force among several -- ongoing Middle East conflict is pushing oil and inflation expectations higher, the $2 trillion annual federal deficit is constant supply pressure -- but all of these forces point the same direction and they compound.
          - paragraph [ref=e1265]:
            - strong [ref=e1266]: Multiple compression.
            - text: Higher risk-free rates directly compress equity multiples. Goldman Sachs currently embeds a 22x forward P/E in its S&P base case, with no compression assumed. At 5.12% on the 30-year, every additional 50 basis points of yield produces a 3 to 4 percent headwind on a 25x multiple stock. Growth companies -- technology, software, anything priced on cash flows five to ten years out -- are longest duration, most exposed.
          - paragraph [ref=e1267]:
            - strong [ref=e1268]: Yen carry trade unwind.
            - text: An estimated $500 billion in outstanding yen carry positions remain globally, per Morgan Stanley. CFTC data shows net short yen positions down 40% since November -- hedge funds covering, orderly so far. The August 2024 episode was triggered by a 20 basis point BoJ hike and took the S&P down 8% in days, VIX to 65 intraday. The current unwind is slower and more telegraphed. That makes it harder to time and easier to underestimate, not less dangerous.
          - heading [level=2] [ref=e1349]: The One Number That Tells You When It’s Real
          - paragraph [ref=e1270]: "USD/JPY is the real-time indicator. Right now: 158.59."
          - paragraph [ref=e1271]: That number tells you repatriation is not yet the dominant flow. Real institutional repatriation -- selling dollar assets, converting back to yen -- would strengthen the yen. USD/JPY would be falling.
          - paragraph [ref=e1272]: The tripwire is 150.
          - paragraph [ref=e1273]: "If USD/JPY breaks below 150 with conviction, institutional flows are accelerating. The carry trade unwind is entering forced-covering territory. The August 2024 playbook applies: reduce duration, cover growth longs, wait for the washout."
          - paragraph [ref=e1274]: Above 150, this is a structural headwind. Below 150, it becomes a catalyst event.
          - heading [level=2] [ref=e1350]: The Rotation Is Already Confirmed
          - paragraph [ref=e1276]: "Materials: up 9% year-to-date, leading all sectors. Industrials rotating in. Energy outperforming. Real estate downgraded to negative. Growth and technology underperforming in relative terms."
          - paragraph [ref=e1277]: Real assets hold their value when the discount rate rises. Long-duration equities don’t. The thesis isn’t speculative. The price action is already saying it out loud.
          - heading [level=2] [ref=e1351]: The Probability Map
          - paragraph [ref=e1279]:
            - strong [ref=e1280]: Base (65%)
            - text: "— No BoJ surprise, slow repatriation continues. JGB 30Y: 3.9-4.1% | USD/JPY: 150-160 | S&P: growth/tech underperforms cyclicals 3-5%, no acute event."
          - paragraph [ref=e1281]:
            - strong [ref=e1282]: Risk (25%)
            - text: "— BoJ surprises with June/July hike to 1.00%; GPIF signals foreign bond reduction. JGB 30Y: 4.2-4.5% | USD/JPY: breaks 150 | S&P: -5 to -8%, concentrated in Nasdaq. Aug 2024 in slow motion."
          - paragraph [ref=e1308]:
            - strong [ref=e1309]: Tail (10%)
            - text: "— Forced carry unwind; Japanese bank balance sheet pressure. JGB 30Y: 4.5%+ | USD/JPY: 140-145 in days | S&P: -12 to -18% global risk-off."
          - paragraph [ref=e1310]:
            - text: The rotation trade is confirmed and already in the price. The risk case trigger is the BoJ June or July meeting -- three dissenters in April makes it live. Calendar it. Watch USD/JPY. Watch the US 10-year. Those three inputs tell you whether this stays a headwind or becomes an event.
            - strong [ref=e1311]: The Bottom Line
          - paragraph [ref=e1286]: Japan built a $1.14 trillion position in US Treasuries over thirty years of near-zero domestic rates.
          - paragraph [ref=e1287]: The era of near-zero domestic rates is over.
          - paragraph [ref=e1288]: The position is unwinding. Slowly. Structurally. Without a dramatic catalyst or a clean moment to panic-sell.
          - paragraph [ref=e1289]: The market is treating this as a bond market story. It isn’t. It’s a discount rate story. And discount rates are the gravity that every equity multiple in this market is fighting against.
          - paragraph [ref=e1290]: The 30-year JGB above 4% is not the event. It’s the signal that the event has already begun.
          - heading [level=2] [ref=e1352]: What I’m Watching
          - paragraph [ref=e1292]: Three things this week. The BoJ meeting date -- does a June hike get officially telegraphed or ruled out. USD/JPY at 150 -- that’s the line where repatriation stops being theoretical and starts showing up in flows. And the US 10-year at 4.75% -- that’s where Goldman’s 22x compression assumption starts breaking visibly in growth multiples.
          - paragraph [ref=e1293]: If USD/JPY holds above 150 through the BoJ meeting, I’m staying long materials, industrials, and energy with reduced exposure to growth names. If it breaks 150, I cover growth longs the same day and wait for the washout before re-entering. The thesis doesn’t require a crash to be right. The slow grind is already paying in the rotation.
          - paragraph [ref=e1294]: I’ll update this when the next BoJ meeting date is confirmed. Follow along if you want the thread pulled as it develops.
